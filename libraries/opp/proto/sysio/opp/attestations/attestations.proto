syntax = "proto3";

package sysio.opp.attestations;

import "sysio/opp/types/types.proto";

option cc_enable_arenas = true;

// ---------------------------------------------------------------------------
//  Operator action — DEPOSIT_REQUEST / WITHDRAW_REQUEST / WITHDRAW_REMIT / SLASH
//
//  An audit record of a collateral change on `sysio.opreg`, kept in each
//  operator's `recent_actions` (OperatorActionLog). Collateral is depot-native,
//  so no outpost holds or releases it.
// ---------------------------------------------------------------------------

message OperatorAction {
  enum ActionType {
    ACTION_TYPE_UNKNOWN          = 0;
    ACTION_TYPE_DEPOSIT_REQUEST  = 1;
    ACTION_TYPE_WITHDRAW_REQUEST = 2;
    ACTION_TYPE_WITHDRAW_REMIT   = 3;
    ACTION_TYPE_SLASH            = 4;
  };
  ActionType                       action_type = 1;
  // Operator's outpost-chain identity (full chain public key).
  sysio.opp.types.ChainAddress     op_address  = 2;
  sysio.opp.types.OperatorType     type        = 3;
  sysio.opp.types.OperatorStatus   status      = 4;
  sysio.opp.types.TokenAmount      amount      = 5;
  // Links a WITHDRAW_REMIT back to its originating WITHDRAW_REQUEST.
  uint64                           request_id  = 6;
  // Chain identifier (codename) of the balance row the action changed.
  uint64                           chain_code  = 7;
  // Human-readable reason recorded by the depot. Populated on SLASH and
  // on log-only failure paths; empty otherwise.
  string                           reason      = 8;
  // Historical external-reserve routing metadata. Native collateral audit
  // records leave this field zero; no current depot action routes a slash
  // into an external reserve.
  uint64                           reserve_code = 9;
}

// Per-operator audit log entry stored in `sysio.opreg::operators[].recent_actions`.
message OperatorActionLog {
  OperatorAction action        = 1;
  bool           success       = 2;
  int64          timestamp     = 3;
  string         error_message = 4;
}

// ---------------------------------------------------------------------------
//  Node owner registration
// ---------------------------------------------------------------------------

// Node owner registration via ERC1155 NFT deposit on an external chain.
message NodeOwnerRegistration {
  sysio.opp.types.ChainAddress actor          = 1;  // Depositor's ETH address (for reference)
  bytes                        actor_pub_key  = 2;  // Depositor's full ETH public key (for on-chain verification)
  sysio.opp.types.WireAccount  account        = 3;  // Wire account to register; created in-flow with wire_pub_key if it does not yet exist
  uint32                       tier           = 4;  // Node owner tier: 1, 2, or 3
  sysio.opp.types.ChainAddress token_contract = 5;  // ERC1155 contract address
  uint64                       token_id       = 6;  // NFT token ID
  uint64                       token_amount   = 7;  // ERC1155 token amount
  uint64                       timestamp      = 8;  // Deposit block timestamp (seconds)
  // Wire account owner/active key: key_type names the Wire public_key variant (K1/R1/WA/EM/ED/BLS)
  // and `key` is the raw key bytes (no variant-index prefix). The depot builds the on-chain
  // sysio::public_key from (key_type, key).
  sysio.opp.types.WireKey      wire_pub_key   = 9;
}

// ---------------------------------------------------------------------------
//  Epoch & roster management attestations
// ---------------------------------------------------------------------------

message Operators {
  repeated OperatorEntry operators = 1;
}

message OperatorEntry {
  sysio.opp.types.WireAccount           account   = 1;
  repeated sysio.opp.types.ChainAddress addresses = 2;
  sysio.opp.types.OperatorType          type      = 3;
  sysio.opp.types.OperatorStatus        status    = 4;
}

message BatchOperatorGroups {
  // Index into `groups` of the batch-operator group that will be on duty for
  // the epoch AFTER `epoch_index` -- a one-epoch LOOKAHEAD, not the group
  // serving right now (SOL-378 / WNS-141).
  //
  // An outpost that scopes `epoch_in` admission to its seated active group has
  // to know epoch N's duty group before epoch N's envelope arrives: that
  // envelope's own deliverer belongs to epoch N's group, so shipping epoch N's
  // roster inside it is circular and stalls the bridge at the first rotation.
  // Looking one epoch ahead means envelope N-1 seats the group that authorises
  // envelope N.
  //
  // The depot's internal schedule is NOT shifted -- `epoch_state`'s
  // `current_batch_op_group` still names the group on duty now. Only this field
  // looks ahead.
  //
  // WHAT OUTPOSTS DO WITH IT TODAY (read before wiring it into new math) --
  // the two outposts do NOT agree, so check both before assuming either:
  //
  //   Solana READS it for the quorum denominator: `epoch_in` sizes consensus
  //   via `active_group_member_count(groups, active_group_index)`, so this
  //   index selects the group whose seat count is the bar. Admission does NOT
  //   use it yet -- `check_epoch_in_signer` accepts membership in ANY seated
  //   group -- so a change here moves the DENOMINATOR only.
  //
  //   Ethereum only STORES it (a public getter). Its threshold math sizes
  //   `groupSize` from `batchOpGroups[0]` -- the FRONT group, i.e. the CURRENT
  //   epoch's -- while this index names the NEXT epoch's.
  //
  // The two are not interchangeable: an integrator who swaps `batchOpGroups[0]`
  // for `batchOpGroups[activeGroupIndex()]` without also moving to next-epoch
  // semantics would size the quorum off the wrong group. Until Ethereum adopts
  // the index, the two outposts scope their denominators to DIFFERENT groups
  // for the same envelope -- invisible while every group is the same size, and
  // not invisible once one is short.
  //
  // INVARIANT -- the group this index names is NEVER EMPTY. `advance` WITHHOLDS
  // this attestation entirely rather than publish an empty active group, so an
  // outpost that scopes admission or a quorum denominator to this index may rely
  // on non-emptiness. It may NOT rely on the group being FULL: a group short of
  // `operators_per_epoch` is reachable whenever the ACTIVE batch-operator roster
  // falls below `batch_operator_minimum_active`, and the depot deliberately does
  // not repair that by re-seating a resident operator (window groups must stay
  // DISJOINT -- Ethereum's `_resolveChunkPosition` scans groups in order and
  // returns the first match, so a duplicated operator stages its chunks against
  // a group it is not serving in).
  //
  // A SHORT group is therefore a real, degraded state, and it is NOT benign:
  // group size IS the quorum denominator on both outposts, so short lowers the
  // bar and makes EVEN sizes reachable. Solana's `majority_threshold` is a
  // strict `n / 2 + 1` and is safe at even sizes; Ethereum's
  // `majorityThreshold = (groupSize + 1) / 2` is an exact half at even sizes,
  // where two competing digests can both clear it. Treat a short group as an
  // operations alarm, not as a supported configuration.
  //
  // BASE CASE -- epoch 1's own duty group is deliberately NOT shipped here. The
  // genesis advance (0 -> 1) ships the group for epoch 2; each outpost obtains
  // epoch 1's roster from its own bootstrap instead. On Solana that is
  // `opp_bootstrap`, which seats `registry.groups` explicitly and pins
  // `active_group_index = 0` (NOT `initialize_outpost`, which is init-once and
  // deliberately seats no groups). On Ethereum it is the `rosterInitialized ==
  // false` trust window, during which `isActiveOperator` admits any sender until
  // the first roster lands. The induction therefore starts at bootstrap, not at
  // an attestation -- do not "fix" the apparently-missing base case by shipping
  // epoch 1's group through this field.
  uint32                       active_group_index = 1;
  // The epoch this envelope is FOR. It identifies the envelope, not the roster
  // above; `active_group_index` names the group for `epoch_index + 1`.
  uint32                       epoch_index        = 2;
  // The full sliding window, always shipped whole so a late-joining or
  // soft-reset outpost re-converges on its next inbound envelope.
  repeated BatchOperatorGroup  groups             = 3;
  uint32                       epoch_duration_sec = 4;
}

message BatchOperatorGroup {
  repeated sysio.opp.types.ChainAddress operators = 1;
}

// ---------------------------------------------------------------------------
//  liq syndication (simple_swap)
//
//  A holder syndicates their liq token (liqSOL on Solana) by handing it to the
//  outpost; from that moment the tokens are outpost property and the WIRE
//  depot is the ledger of record for who syndicated what. The outpost keeps no
//  per-user syndication state and never pays a syndicator on its own
//  initiative: every de-syndication is depot-originated (DESYNDICATE_LIQ) and
//  the outpost applies it inline at dispatch, exactly like a remit.
//
//  Every `amount` is a `TokenAmount`: `token_code` is the chain's liq token as
//  registered on the depot (a packed slug_name, e.g. LIQSOL), `amount` is in
//  that token's base units (liqSOL is 9-decimal, so 1:1 with the depot frame).
//  `sequence` is a per-outpost strictly-increasing counter carried so the depot
//  can dedupe replays without retaining per-attestation history.
// ---------------------------------------------------------------------------

// Outpost -> Depot. A user syndicated `amount` liq tokens to the outpost.
message SyndicateLIQ {
  // Chain code of the emitting outpost (bound to the proven source chain).
  uint64                       chain_code = 1;
  // The syndicating user's native PUBKEY -- the one identity the depot
  // parks the syndication against and later matches an AuthX link on.
  // Always the public key, never a derived address, so the same bytes
  // round-trip unchanged through DesyndicateLIQ.user. Encoding follows the
  // VM family: SVM the 32-byte Ed25519 pubkey (which is the address); EVM
  // the 33-byte COMPRESSED secp256k1 point, NOT the 20-byte address --
  // sysio.authex indexes links by pubkey only, and the depot cannot derive
  // an address from a compressed key.
  sysio.opp.types.ChainAddress user       = 2;
  // The liq tokens syndicated: `token_code` names the outpost's liq token as
  // the depot registered it, `amount` is base units of that token.
  sysio.opp.types.TokenAmount  amount     = 3;
  // Per-outpost monotonic sequence shared with LIQYield; dedupe key.
  uint64                       sequence   = 4;
  // The OUTPOST's live custody balance of the liq token, read when the
  // message is built and after this syndication is locked, in the depot
  // frame of `amount`: the liqsol_pool token account on Solana,
  // SyndicationPool.poolBalanceDepot() on Ethereum. The depot checks it is
  // at least its outstanding shadow of the token.
  uint64                       total_syndicated = 5;
}

// Outpost -> Depot. Yield the outpost claimed for the syndicated liq pool since
// its previous report. Global to the outpost: no user address — the depot
// splits it across its own syndication ledger.
message LIQYield {
  uint64                      chain_code = 1;
  // The liq tokens claimed as yield for the syndicated pool: `token_code`
  // names the outpost's liq token, `amount` is base units of that token.
  sysio.opp.types.TokenAmount amount     = 2;
  // Per-outpost monotonic sequence shared with SyndicateLIQ; dedupe key.
  uint64                      sequence   = 3;
  // Outpost-chain epoch at which the report was taken. Informational.
  uint64                      epoch      = 4;
  // The OUTPOST's live custody balance of the liq token, read when the
  // report is built and after the yield is claimed into custody, in the
  // depot frame of `amount` (the same reading SyndicateLIQ carries). The
  // depot checks it is at least its outstanding shadow of the token.
  uint64                      total_syndicated = 5;
}

// Depot -> Outpost. Release `amount` liq tokens from the outpost's syndicated
// pool to `user`. The outpost transfers inline at dispatch; refusals are
// logged and skipped (never retried locally), the depot ledger is authoritative.
message DesyndicateLIQ {
  // Chain code of the destination outpost.
  uint64                       chain_code = 1;
  // The recipient's native PUBKEY, byte-identical to the SyndicateLIQ.user
  // the depot recorded: a de-syndication pays only the AuthX-linked holder of
  // the syndicated position, never an arbitrary destination, so the depot
  // hands back the same identity it holds. The OUTPOST derives the transfer
  // destination: SVM the pubkey is the address; EVM
  // Secp256k1.addressFromCompressedPubkey (the derivation OPPInboundLib
  // already applies to inbound remits).
  sysio.opp.types.ChainAddress user       = 2;
  // The liq tokens to release: `token_code` must name this outpost's liq
  // token (the outpost refuses any other), `amount` is base units of it.
  sysio.opp.types.TokenAmount  amount     = 3;
  // Depot-side request id for correlation in outpost logs.
  uint64                       request_id = 4;
  // The DEPOT's live outstanding shadow of the liq token after this burn:
  // the sysio.liq supply of the shadow symbol plus its yield parked in
  // liqpending, in base units of `amount`. The outpost checks its custody
  // after this payout is at least this total.
  uint64                       total_syndicated = 5;
}

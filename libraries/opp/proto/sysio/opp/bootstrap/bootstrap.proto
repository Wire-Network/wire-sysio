syntax = "proto3";

package sysio.opp.bootstrap;

import "sysio/opp/types/types.proto";

option cc_enable_arenas = true;

// ---------------------------------------------------------------------------
//  Platform bootstrap configuration — launch-day input shape.
//
//  Human-authored JSON instances of `BootstrapPlatformConfig` drive the launch
//  bootstrap tool, replacing the hard-coded chain / token / reserve dataset in the
//  cluster tooling. The tool replays the config onto the chain inside the
//  bootstrap window (sysio.epoch current_epoch_index == 0): every registration
//  is priv-gated and lands ACTIVE inline.
//
//  Authoring conventions — these differ DELIBERATELY from the registry
//  carriers in sysio/opp/types/types.proto (`Chain` / `Token` / `ChainToken`
//  / `Reserve`), which are wire messages with packed-uint64 codes, raw `bytes`
//  addresses, and lifecycle fields that are outputs, not inputs:
//
//    * codes are STRINGS ("ETHEREUM", "USDC", "PRIMARY"); the tool packs them
//      via slug_name (alphabet [A-Z0-9_], <= 8 chars). Packed uint64s are
//      write-only for humans and render as opaque digit strings in JSON.
//    * addresses are STRINGS in chain-native display form (0x-hex for EVM,
//      base58 for SVM) so each one is eyeball-verifiable against a block
//      explorer at launch review. `bytes` would render as base64 in JSON.
//    * amounts are uint64 SUBUNITS (9-decimal unless the token's `precision`
//      says otherwise), matching the contract action params exactly. Proto3
//      canonical JSON renders 64-bit ints as QUOTED strings — always quote
//      amounts in authored JSON, since launch-scale values exceed 2^53 and
//      bare numbers get silently mangled by common JSON tooling.
//    * enums appear by full value name in JSON ("TOKEN_KIND_ERC20").
//    * field names are snake_case, exactly as declared here.
//
//  The bootstrap tool is the authority on cross-field invariants (declared
//  references, exactly-one-native-per-chain, the WIRE earmark sum, etc.); a
//  companion validator enforces the same set so a malformed config fails
//  before any irreversible action is pushed.
// ---------------------------------------------------------------------------

// A chain to register via `sysio.chains::regchain(kind, code,
// external_chain_id, name, description)`.
//
// There is no `is_depot` field: the depot row is implied by
// `kind == CHAIN_KIND_WIRE` — exactly one entry carries it, with code "WIRE".
message ChainSpec {
  // VM family. CHAIN_KIND_WIRE marks the singleton depot chain.
  sysio.opp.types.ChainKind kind              = 1;
  // Chain codename slug, e.g. "ETHEREUM" (<= 8 chars, [A-Z0-9_]).
  string                    code              = 2;
  // External chain id: 1 = Ethereum mainnet; 0 = WIRE depot / Solana.
  uint32                    external_chain_id = 3;
  // Human-readable display name.
  string                    name              = 4;
  // Free-form description / provenance note.
  string                    description       = 5;
}

// A token to register via `sysio.tokens::regtoken(...)` plus its single chain
// binding via `sysio.tokens::regctok(...)`. The binding is FOLDED IN because a
// token binds to exactly one chain in practice — multi-chain deployments of
// the "same" asset use distinct codes (USDC vs USDCSOL), so a separate
// chain-token array would only add a cross-reference spelling hazard to a
// hand-edited file. (If a genuine multi-binding need ever appears, a
// `repeated` additional-bindings field can be added without breaking JSON.)
message TokenSpec {
  // Token standard. NATIVE marks the chain's own gas asset.
  sysio.opp.types.TokenKind kind             = 1;
  // Token codename slug, e.g. "USDCSOL" (<= 8 chars, [A-Z0-9_]).
  string                    code             = 2;
  // Display symbol / name, e.g. "USD Coin".
  string                    symbol_name      = 3;
  // Free-form description / provenance note.
  string                    description      = 4;
  // DEPOT-FRAME decimal precision, i.e. `min(native precision, 9)` — NOT the
  // token's native precision. Valid range 1..9: `sysio.tokens::regtoken` rejects
  // anything above MAX_TOKEN_PRECISION (9), so a higher value would pass config
  // validation and then abort the irreversible bootstrap. A token whose native
  // precision exceeds the frame (ETH at 18) declares the frame value here and is
  // downscaled at the outpost boundary; the cap is what keeps every uint64/int64
  // amount field in range. This value also supplies `regreserve`'s
  // `source_token_precision` for any reserve pairing this token — see
  // `ReserveSpec`.
  uint32                    precision        = 5;
  // Chain this token binds to — must reference a declared `ChainSpec.code`.
  string                    chain_code       = 6;
  // Contract address in chain-native display form (0x-hex EVM / base58 SVM).
  // EMPTY for a native token.
  string                    contract_address = 7;
  // True for the chain's native asset. Exactly one token per chain is native.
  bool                      is_native        = 8;
}

// A launch reserve to seed via
// `sysio.reserv::regreserve(chain_code, token_code, reserve_code, name,
//  description, initial_chain_amount, initial_wire_amount,
//  source_token_precision, connector_weight_bps, is_private, owner)`.
//
// ELEVEN arguments. `source_token_precision` — the 8th — has no field in this
// message; it is the paired `TokenSpec.precision` (see `token_code` below).
//
// The WIRE side (`initial_wire_amount`) is drained from the `sysio` emissions
// treasury into reserve custody at registration time (real WIRE transfer; see
// `BootstrapPlatformConfig.t5_reserve_allocation`).
message ReserveSpec {
  // Reserve codename slug, conventionally "PRIMARY".
  string code                  = 1;
  // Outpost chain this reserve lives on — references a declared non-WIRE
  // `ChainSpec.code`.
  string chain_code            = 2;
  // Token paired against WIRE — must reference a `TokenSpec` bound to
  // `chain_code`.
  //
  // That referenced spec ALSO supplies `regreserve`'s `source_token_precision`
  // argument, which has no field of its own here: it is the paired token's
  // depot-frame `TokenSpec.precision` (`min(native, 9)`). Resolve
  // `(chain_code, token_code)` to its `TokenSpec` and pass that precision;
  // `regreserve` rejects anything above 9 (`WIRE_PRECISION`).
  string token_code            = 3;
  // Human-readable display name.
  string name                  = 4;
  // Free-form description / provenance note.
  string description           = 5;
  // Outpost-side token seed, in that token's subunits (quote in JSON).
  uint64 initial_chain_amount  = 6;
  // WIRE-side seed, in WIRE subunits, drained from the earmark (quote in JSON).
  uint64 initial_wire_amount   = 7;
  // Bancor connector weight (WIRE-side) in basis points: 1..9999; 5000 =
  // 50/50 pure constant product. Honored by the weighted swap curve. 10000 is
  // rejected by regreserve: it zeroes the token-side weight, so every quote is 0
  // (a dead, unpriceable reserve).
  uint32 connector_weight_bps  = 8;

  // Private-reserve support (live as of the reserve-and-swap beta). A private
  // reserve pairs same-owner only and is excluded from WIRE-endpoint swaps.
  // Post-bootstrap creation derives ownership from the authex-linked matcher;
  // the bootstrap `regreserve` path seeds it directly via these two fields.
  bool   is_private = 9;
  // Owning WIRE account name (regreserve's `owner`, a sysio::name). EMPTY for
  // public reserves; REQUIRED (and a valid account name) when `is_private`.
  string owner      = 10;
}

// A shadow-liq yield pool to seed via
// `sysio.liq::regliqpool(chain_code, token_code, pair_symbol,
//  initial_chain_amount, initial_wire_amount, fee, locked_shares,
//  conversion_horizon_sec, depth_cap_bps, clip_floor)`.
//
// TEN arguments, one per field below. The action mints `initial_chain_amount`
// of the token's shadow to `sysio` (the LCO liq, protocol-owned and already in
// outpost custody), deposits it with `initial_wire_amount` WIRE from the
// `sysio` treasury into `sysio.swap`, creates the pair with `sysio` as its fee
// authority and the shadow as its yield leg, and sets the tick parameters. The
// WIRE side is the `t5_dex_allocation` earmark being drained; the shadow symbol
// must already exist (`sysio.liq::create`). Exactly one pool per shadow.
message LiqPoolSpec {
  // Outpost chain the liq token lives on — references a declared non-WIRE
  // `ChainSpec.code`.
  string chain_code             = 1;
  // The liq token — must reference a `TokenSpec` of kind TOKEN_KIND_LIQ bound
  // to `chain_code`.
  string token_code             = 2;
  // The swap's pair (LP) token symbol CODE, 1..7 characters [A-Z]; the tool
  // passes it at precision 9, the depot frame, which is what `inittoken`
  // requires of a 9-decimal shadow against 9-decimal WIRE.
  string pair_symbol            = 3;
  // Human-readable display name.
  string name                   = 4;
  // Free-form description / provenance note.
  string description            = 5;
  // Shadow-side seed: the LCO liq, in the token's subunits (quote in JSON).
  uint64 initial_chain_amount   = 6;
  // WIRE-side seed, in WIRE subunits, drained from `t5_dex_allocation`
  // (quote in JSON).
  uint64 initial_wire_amount    = 7;
  // The pair's swap fee in 1/10000 of the traded amount: 0..9999.
  uint32 fee                    = 8;
  // LP shares locked forever, in the pair symbol's subunits (quote in JSON);
  // below the minted sqrt(initial_chain_amount * initial_wire_amount).
  uint64 locked_shares          = 9;
  // Horizon over which queued yield is meant to sell, in seconds (> 0).
  uint32 conversion_horizon_sec = 10;
  // Hard ceiling on one clip, in basis points of the pool's shadow side:
  // 1..10000, and best kept below roughly twice `fee`.
  uint32 depth_cap_bps          = 11;
  // Least clip worth selling, in the shadow's subunits (> 0; quote in JSON).
  uint64 clip_floor             = 12;
  // Optional cross-check: the liq the outpost holds in custody at the snapshot,
  // in the token's subunits (quote in JSON). When non-zero it must equal
  // `initial_chain_amount` plus the sum of the `syndications` for this token,
  // since the depot mints shadow against exactly that custody. 0 skips it.
  uint64 custody_total          = 13;
}

// A pre-launch syndicated position to replay via
// `sysio.liq::importsynd(chain_code, token_code, credits[] {pubkey, amount})`
// (batched by the tool; `importdone` closes the import). Filled from the same
// launch export that produces the WPT credits.
message SyndicationSpec {
  // Outpost chain — references a declared non-WIRE `ChainSpec.code`.
  string chain_code = 1;
  // The liq token — a TOKEN_KIND_LIQ `TokenSpec` bound to `chain_code`.
  string token_code = 2;
  // The holder's native PUBKEY in display form, the identity
  // `SyndicateLIQ.user` carries: base58 of the 32-byte Ed25519 key on SVM,
  // 0x-hex of the 33-byte COMPRESSED secp256k1 point on EVM (never the
  // 20-byte address).
  string pubkey     = 3;
  // The position, in the token's subunits (quote in JSON), with the LCO yield
  // already folded in.
  uint64 amount     = 4;
}

// Global swap settings applied once via `sysio.uwrit::setconfig`, which takes
// SIX arguments: `(fee_bps, collateral_lock_duration_ms, min_fromwire_amount,
// fromwire_revert_fee_bps, uwreq_pending_timeout_epochs,
// uwreq_retention_epochs)`. This message pins only the first two; a bootstrap
// caller supplies the remaining four itself, using the contract's `uw_config`
// in-struct defaults (5 WIRE floor, 500 bps revert fee, and the two uwreq
// lifecycle windows) unless it has a reason to override them.
//
// NO fee-DISTRIBUTION shares are configured here. The routing is a two-stage
// split of the network fee plus an independent per-reserve owner fee:
//
//   * `fee_bps` is the NETWORK fee, taken out of the WIRE leg of every swap.
//     `sysio.reserv` splits that component 50/50 between the swap's WINNING
//     UNDERWRITER (claimable via `claimuwfee`) and a REWARDS POOL — the fixed
//     protocol constant `sysio.reserv::FEE_UNDERWRITER_SHARE_BPS`.
//   * The rewards pool then splits again by the OPTIONAL governance dial
//     `sysio.reserv::reserve_config.fee_emissions_share_bps` (`reservcfg`): that
//     share is transferred to the `sysio` emissions treasury, the remainder
//     accrues to the rewards bucket for batch operators. Nothing seeds
//     `reservcfg`, so the dial reads ZERO until `sysio.reserv::setconfig` first
//     persists a row — at which default the whole pool is allocated to batch
//     operators and no fee leaves `sysio.reserv`'s custody at settlement.
//   * Each participating non-WIRE leg's reserve ALSO charges its own
//     `owner_fee_bps` off the same WIRE leg, INDEPENDENTLY of `fee_bps`
//     (`ReserveSpec` does not carry it; it is set post-bootstrap via
//     `sysio.reserv::setrsvfee`). So `fee_bps` is not the whole effective swap
//     fee: a chain-to-chain swap pays two owner fees plus the network fee.
message UwritConfig {
  // Per-spoke depot swap fee in basis points (<= 9999; a 100% fee is rejected),
  // taken out of the WIRE leg of every swap.
  uint32 fee_bps                     = 1;
  // Wall-clock collateral lock window in MILLISECONDS (> 0). Contract default
  // is 43_200_000 (12h).
  uint64 collateral_lock_duration_ms = 2;

  // Slots 3-5 were fee_split_winner_pct / fee_split_other_uw_pct /
  // fee_split_batch_op_pct (whole-percent distribution shares) — removed. Field
  // numbers stay reserved so the wire format cannot reuse them. Distribution is
  // no longer configured here at all: see the two-stage split described above.
  reserved 3, 4, 5;
  reserved "fee_split_winner_pct", "fee_split_other_uw_pct", "fee_split_batch_op_pct";
}

// Top-level launch platform bootstrap configuration. One JSON instance per
// deployment. (This is the WIRE *platform* bootstrap — chains, tokens, reserves
// and global swap settings — not a DEX: it stands up the launch-day registry
// state, of which the swap reserves are one part.)
message BootstrapPlatformConfig {
  // Schema version; bump on a breaking shape change. Must be 1.
  uint32 schema_version = 1;

  // Deployment label ("mainnet-launch" / "dev-cluster"); the bootstrap tool
  // sanity-checks it against its target.
  string network = 2;

  // WIRE subunits earmarked from the T5 allotment to back the WIRE side of
  // launch reserves. Sits OUTSIDE `emission_config.t5_distributable`: at
  // genesis, t5_distributable = T5_allotment - t5_reserve_allocation -
  // t5_dex_allocation, so the sysio.epoch emissions readiness gate never sees a
  // short treasury balance after `regreserve` drains the reserve backing.
  // Invariant: sum(reserves[].initial_wire_amount) <= t5_reserve_allocation.
  uint64 t5_reserve_allocation = 3;

  // WIRE subunits earmarked from the T5 allotment to back the WIRE side of the
  // launch shadow-liq yield pools (`liq_pools`), drained by
  // `sysio.liq::regliqpool`. Like `t5_reserve_allocation`, this sits OUTSIDE
  // `t5_distributable`, so the total T5 carve-out is
  // `t5_reserve_allocation + t5_dex_allocation`; the figure is set
  // per-deployment (Kyle / Ken own the launch number).
  // Invariant: sum(liq_pools[].initial_wire_amount) <= t5_dex_allocation.
  uint64 t5_dex_allocation = 8;

  // Chains to register (one must be the CHAIN_KIND_WIRE depot).
  repeated ChainSpec   chains   = 4;
  // Tokens to register, each with its single chain binding.
  repeated TokenSpec   tokens   = 5;
  // Reserves to seed (WIRE side drained from the earmark).
  repeated ReserveSpec reserves = 6;
  // Global swap / underwriting settings.
  UwritConfig          uwrit    = 7;
  // Shadow-liq yield pools to seed, one per liq token (WIRE side drained from
  // `t5_dex_allocation`).
  repeated LiqPoolSpec     liq_pools    = 9;
  // Pre-launch syndicated positions to replay into the shadow-liq ledger.
  repeated SyndicationSpec syndications = 10;
}

name: "Depot flow coverage"

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
  schedule:
    # Catch tools-only drift even when no Sysio change is being proposed.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      wire-tools-ref:
        description: "wire-tools-ts branch, tag or commit whose enabled flows must be mapped"
        type: string
        default: master

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  standalone:
    name: Standalone inventory consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate native references and boundaries without tools
        run: python3 contracts/tools/verify_depot_flow_coverage.py

      - name: Test standalone and coordinated verifier behavior
        run: python3 -m unittest discover -s contracts/tools/tests -p test_verify_depot_flow_coverage.py -v

  coordinated:
    name: Cross-repository flow completeness
    # The tools checkout is private; fork PRs retain the standalone check without secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out selected tools revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5
        with:
          repository: Wire-Network/wire-tools-ts
          ref: ${{ inputs.wire-tools-ref || 'master' }}
          token: ${{ secrets.GH_TOKEN_DEV }}
          path: wire-tools-ts
          persist-credentials: false

      - name: Record selected tools revision
        run: git -C wire-tools-ts rev-parse HEAD

      - name: Check all enabled tools flows have reviewed mappings
        run: python3 contracts/tools/verify_depot_flow_coverage.py --tools-root "$GITHUB_WORKSPACE/wire-tools-ts"

name: "Tag Release"

# Gate 2 of the Strategy-C release path (docs/release-workflow.md). The job runs
# under the `release` Environment, so it PAUSES for a required reviewer before it
# creates anything. After approval it tags the HEAD of `branch`, opens a DRAFT
# release, and dispatches the platform builds plus the asset workflow.
#
# `version`'s suffix IS the channel (suffix => prerelease). `branch` is master or
# the version's release/<major>.<minor> branch. The `release` Environment only
# deploys from master, so this workflow is always dispatched on master and takes
# the branch to tag as an input.
#
# Structurally identical to wire-cdt/.github/workflows/tag-release.yaml -- the two
# repos run the same release path, so the two files are kept in lock-step.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, without a leading v (e.g. 1.0.0-dev, 1.1.0-rc1, 1.1.0). Must already be the branch's version."
        type: string
        required: true
      branch:
        description: "Branch whose HEAD is tagged: master, or the version's release/<major>.<minor> branch (e.g. release/1.1 for 1.1.0-rc1)"
        type: string
        required: true
        default: master
      wire-cdt-release:
        description: "Optional wire-cdt RELEASE tag to build against (e.g. v1.0.1). When omitted, the build resolves the highest published wire-cdt release in the same channel as this version, at or below its <major>.<minor> line."
        type: string
        required: false
        default: ""

permissions:
  contents: write
  # `gh workflow run` dispatches the build + release workflows.
  actions: write

concurrency:
  # One tagging run per version, and never cancel one mid-flight: a cancelled run
  # can leave a tag without its draft release, which the next attempt would then
  # refuse (never re-tag).
  group: tag-release-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: Tag the branch and start the release builds
    runs-on: ubuntu-latest
    # Required reviewers on this Environment are gate 2 -- nothing below runs until
    # a human approves the deployment.
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      # Untrusted dispatch inputs: environment variables only, never interpolated
      # into a script body.
      VERSION: ${{ inputs.version }}
      TARGET_BRANCH: ${{ inputs.branch }}
    steps:
      # master stays at the workspace root: its parser vets the inputs and reads
      # the target branch's version, so no code from the target branch runs here.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5
        with:
          ref: master

      - name: Validate the version and the target branch
        run: |
          set -euo pipefail

          # The grammar is cmake-version.py's VERSION_RE, asserted by the parser
          # itself rather than re-spelled here -- the same checks prepare-release
          # ran on this version and branch before the bump merged.
          python3 .github/scripts/cmake-version.py validate "$VERSION" \
            || { echo "::error::'${VERSION}' is not <major>.<minor>.<patch>[-<suffix>] (no leading v)" >&2; exit 1; }
          python3 .github/scripts/cmake-version.py validate "$VERSION" --branch "$TARGET_BRANCH" \
            || { echo "::error::${VERSION} is tagged on master or its own release/<major>.<minor> branch, not '${TARGET_BRANCH}'" >&2; exit 1; }

          # Once a line has its release branch, its versions are tagged there.
          if [[ "$TARGET_BRANCH" == master ]]; then
            release_branch="$(python3 .github/scripts/cmake-version.py release-branch "$VERSION")"
            status=0
            git ls-remote --exit-code --heads origin "refs/heads/${release_branch}" >/dev/null || status=$?
            if [[ $status -eq 0 ]]; then
              echo "::error::${release_branch} exists, so ${VERSION} is tagged there, not on master." >&2
              exit 1
            elif [[ $status -ne 2 ]]; then
              echo "::error::Could not check origin for ${release_branch} (git ls-remote exit ${status})." >&2
              exit 1
            fi
          fi

          # The bump PR (gate 1) shows only the version change, so the branch's
          # other commits must already have been reviewed: refuse a branch whose
          # rules do not require a pull request.
          rules="$(gh api "repos/${GITHUB_REPOSITORY}/rules/branches/${TARGET_BRANCH}" --jq '[.[].type] | join(",")')"
          if [[ ",${rules}," != *",pull_request,"* ]]; then
            echo "::error::${TARGET_BRANCH} has no pull_request rule (rules: ${rules:-none}). Protect it before tagging from it." >&2
            exit 1
          fi

      # refs/heads/ so a tag that shares the branch's name is never checked out.
      # No credentials: nothing in this job pushes from the target tree.
      - name: Check out the target branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5
        with:
          ref: refs/heads/${{ inputs.branch }}
          path: target
          persist-credentials: false

      - name: Assert the branch HEAD carries the requested version
        id: assert
        run: |
          set -euo pipefail

          # The same parser prepare-release.yaml writes with and release.yaml
          # cross-checks the tag against.
          head_version="$(python3 .github/scripts/cmake-version.py read --cmakelists target/CMakeLists.txt)"
          if [[ "$head_version" != "$VERSION" ]]; then
            echo "::error::${TARGET_BRANCH} HEAD is version ${head_version}, not ${VERSION}. Merge the prepare-release PR first." >&2
            exit 1
          fi

          # The suffix decides the channel for the whole downstream path.
          if [[ "$VERSION" == *-* ]]; then
            prerelease="true"
          else
            prerelease="false"
          fi

          tag="v${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists. Never re-tag -- cut the next -rcN instead." >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "sha=$(git -C target rev-parse HEAD)"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Create the annotated tag
        env:
          TAG: ${{ steps.assert.outputs.tag }}
          SHA: ${{ steps.assert.outputs.sha }}
        run: |
          set -euo pipefail

          # An annotated tag is TWO API calls, in this order: the tag object first,
          # then the ref that points at it. `gh release create --verify-tag` needs
          # the ref to exist, so the ref call must come second.
          tag_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags" -X POST \
              -f tag="$TAG" \
              -f message="$TAG" \
              -f object="$SHA" \
              -f type=commit \
              --jq .sha
          )"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -X POST \
            -f ref="refs/tags/${TAG}" \
            -f sha="$tag_sha" > /dev/null
          echo "Created annotated tag ${TAG} -> ${SHA} (tag object ${tag_sha})"

      - name: Create the draft release
        env:
          TAG: ${{ steps.assert.outputs.tag }}
          PRERELEASE: ${{ steps.assert.outputs.prerelease }}
        run: |
          set -euo pipefail

          # Draft, so no half-populated release is ever public: release.yaml flips
          # the draft only after every artifact has been verified and attached.
          # The notes and the prerelease flag are set HERE -- release.yaml never
          # creates the release on this path.
          args=(--draft --verify-tag --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"

      - name: Dispatch the platform builds on the tag ref
        env:
          TAG: ${{ steps.assert.outputs.tag }}
          # Untrusted dispatch input: environment variable only, never
          # interpolated into the script body.
          WIRE_CDT_RELEASE: ${{ inputs.wire-cdt-release }}
        run: |
          set -euo pipefail

          # A tag created with GITHUB_TOKEN fires NO push event, so the tag builds
          # must be dispatched explicitly. `--ref "$TAG"` (the bare tag name, which
          # gh resolves to the tag ref) makes `github.ref` inside those runs the tag
          # ref, so the existing startsWith(github.ref, 'refs/tags/v') gates --
          # system-contract build, Wire CDT install, contracts bundle -- behave
          # exactly as on a tag push.
          #
          # An explicit wire-cdt-release travels to the linux build (the only CDT
          # consumer); when omitted, the build's `v` job resolves the highest
          # published wire-cdt release in this version's channel, at or below its
          # <major>.<minor> line.
          linux_args=()
          if [[ -n "$WIRE_CDT_RELEASE" ]]; then
            linux_args+=(-f wire-cdt-release="$WIRE_CDT_RELEASE")
          fi
          gh workflow run linux_amd64_build.yaml --ref "$TAG" "${linux_args[@]}"
          gh workflow run macos_arm64_build.yaml --ref "$TAG"
          echo "Dispatched linux_amd64_build.yaml and macos_arm64_build.yaml on ${TAG}"

      - name: Dispatch the OPP bundles publish on the tag ref
        env:
          TAG: ${{ steps.assert.outputs.tag }}
          PRERELEASE: ${{ steps.assert.outputs.prerelease }}
        run: |
          set -euo pipefail

          # The models are generated from the tag's protos, so the workflow runs
          # ON the tag ref (the cargo publisher OIDC trust accepts refs/tags/v*
          # alongside master — wire-infra ArtifactManagementStack). The version
          # suffix decides the channel, same rule as everywhere downstream.
          channel=stable
          if [[ "$PRERELEASE" == "true" ]]; then
            channel=dev
          fi
          gh workflow run opp-bundles.yaml --ref "$TAG" -f channel="$channel"
          echo "Dispatched opp-bundles.yaml on ${TAG} (channel ${channel})"

      - name: Dispatch the release asset workflow
        env:
          TAG: ${{ steps.assert.outputs.tag }}
        run: |
          set -euo pipefail

          # Dispatched on master (the workflow file's home); the tag travels as the
          # input. release.yaml waits for both tag-ref builds to finish, verifies
          # every artifact, attaches them, then flips the draft.
          gh workflow run release.yaml --ref master -f tag="$TAG"
          echo "Dispatched release.yaml for ${TAG}"

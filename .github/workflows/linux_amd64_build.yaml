name: "Linux amd64 build & tests"

on:
  push:
    branches:
      - master
      - "release/*"
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  workflow_dispatch:
    inputs:
      wire-cdt-release:
        description: 'Explicit wire-cdt RELEASE tag to build against (e.g. v1.0.0-rc2). Its channel is then derived from the release itself. When omitted, a tag build resolves the latest published wire-cdt release in the same channel as the version being built.'
        type: string

permissions:
  actions: read
  packages: read
  contents: read

env:
  WORKFLOW_NAME: "Build & Test Workflow"

defaults:
  run:
    shell: bash

jobs:
  root-node-tooling:
    name: Root Node tooling audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5

      - name: Validate coredump isolation policy
        run: python3 .github/scripts/check-coredump-policy.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Validate root pnpm lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Load plop generators
        run: |
          node <<'NODE'
          const plopfile = require("./plopfile.js")
          const calls = { generators: [] }
          const plop = {
            setActionType() {},
            setHelper() {},
            setGenerator(name) { calls.generators.push(name) }
          }
          plopfile(plop)
          const expected = ["create-cxx-library", "create-cxx-plugin"]
          const missing = expected.filter(name => !calls.generators.includes(name))
          if (missing.length) {
            throw new Error(`Missing plop generators: ${missing.join(", ")}`)
          }
          NODE

  platform-cache:
    name: Platform Cache
    uses: Wire-Network/platform-cache-workflow/.github/workflows/platformcache.yaml@8ef11452f85e0accaf8e68e6cc42c54fb890be14 # Wire-Network/platform-cache-workflow@v2
    permissions:
      packages: write
      contents: read
    with:
      runs-on: '{"group": "core-repo-group"}'
      platform-files: |
        .cicd/platforms

  build-test-package:
    name: Build, test, and package (${{matrix.platform}})
    needs: [platform-cache, root-node-tooling, v]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu24
            build_jobs: 11
            run_sharded_np_lr: true
          - platform: ubsan
            build_jobs: 11
            run_sharded_np_lr: true
          - platform: asan
            build_jobs: 11
            run_sharded_np_lr: false
          - platform: asserton
            build_jobs: 11
            run_sharded_np_lr: true
          - platform: gcc
            build_jobs: 8
            run_sharded_np_lr: true
    runs-on:
      group: core-repo-group
    # Full-job ceiling for build, package, parallel tests, and sharded NP/LR tests whose per-test timeout is 45 minutes.
    timeout-minutes: 360
    container:
      image: ${{fromJSON(needs.platform-cache.outputs.platforms)[matrix.platform].image}}
      credentials:
        username: dev-wire
        password: ${{ secrets.GH_TOKEN_DEV }}
      # Fork PR code must not see the shared runner's host dumps; same-repository and non-PR runs retain debug access.
      # SEC-112 tracks enforcing the protected workflow revision at the runner-group boundary.
      options: >-
        --security-opt seccomp=unconfined
        ${{ (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository)
            && '--mount type=bind,source=/var/lib/systemd/coredump,target=/cores'
            || '' }}
      volumes:
      - ${{ github.workspace }}:/__w/wire-sysio/wire-sysio
    env:
      CCACHE_MAXSIZE: "10G"
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"
    steps:
      - name: Allow safe directories
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5
        with:
          submodules: recursive

      # Split restore/save (not the monolithic actions/cache): the post-job save of
      # the monolithic action runs BEFORE the vcpkg-binary-cache directory has been
      # fully populated on a partial-restore run, so the freshly built binaries were
      # never persisted. The paired save step below runs immediately after the build
      # script, and only when the restore missed the exact key (caches are immutable).
      - name: Restore vcpkg binary cache
        id: restore-vcpkg
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-binaries-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/vcpkg-triplets/**') }}
          restore-keys: |
            vcpkg-binaries-${{ matrix.platform }}-

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.platform }}-

      # Wire CDT is acquired from a GitHub RELEASE asset, not from a CI
      # artifact: CI artifacts expire after 30 days, so an old tag could no longer
      # be rebuilt reproducibly. The release is resolved by the `v` job — an
      # explicit `wire-cdt-release` dispatch input, or the latest published
      # wire-cdt release in the same channel as the version being built. The
      # resolved tag is recorded in build-metadata.json and, downstream, in the
      # release's wire-sysio-versions-<version>.json.
      #
      # Wire-Network/wire-cdt is public, so no GH_TOKEN_DEV is required here; the
      # workflow's own GITHUB_TOKEN is passed as GH_TOKEN purely to lift the
      # unauthenticated rate limit. The .cicd/platforms images bake the GitHub
      # CLI (see the gh block in each Dockerfile), so `gh release download` does
      # the asset resolution instead of a hand-rolled curl + jq walk of the
      # assets array.
      - name: Download Wire CDT release package for release tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          CDT_RELEASE: ${{ needs.v.outputs.cdt-release }}
          CDT_CHANNEL: ${{ needs.v.outputs.cdt-channel }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -z "$CDT_RELEASE" || "$CDT_RELEASE" == "null" ]]; then
            echo "::error::The v job did not resolve a wire-cdt release for this build" >&2
            exit 1
          fi

          not_published_hint() {
            echo "::error::Wire CDT release ${CDT_RELEASE} could not be read from Wire-Network/wire-cdt." >&2
            echo "The resolved release may not be PUBLISHED YET: tag-release.yaml creates wire-cdt releases as DRAFTS, and a draft is invisible to this build (as is a deleted or renamed tag). Check https://github.com/Wire-Network/wire-cdt/releases, and publish the wire-cdt release (or dispatch with an explicit wire-cdt-release) before re-running this build." >&2
          }

          # The resolved release's channel must agree with the v job's
          # resolution, otherwise the resolution and the build disagree about
          # what shipped. `derive` is the explicit-input path (workflow_dispatch
          # wire-cdt-release): there is no resolved channel to agree with, so
          # the release's own flag is reported rather than asserted.
          if ! release_view="$(gh release view "$CDT_RELEASE" -R Wire-Network/wire-cdt --json tagName,isDraft,isPrerelease 2>&1)"; then
            not_published_hint
            echo "$release_view" >&2
            exit 1
          fi
          # A draft is normally invisible to this token and would already have
          # failed above; the explicit check covers the case where it IS visible,
          # so the failure names the reason instead of surfacing as a missing asset.
          if [[ "$(jq -r '.isDraft' <<<"$release_view")" == "true" ]]; then
            echo "::error::Wire CDT release ${CDT_RELEASE} is still a DRAFT. Publish it (tag-release.yaml creates wire-cdt releases as drafts; release.yaml flips them) before running this build." >&2
            exit 1
          fi

          release_prerelease="$(jq -r 'if .isPrerelease then "true" else "false" end' <<<"$release_view")"
          case "$CDT_CHANNEL" in
            prerelease) expected_prerelease="true" ;;
            stable)     expected_prerelease="false" ;;
            derive)
              echo "Wire CDT release ${CDT_RELEASE} supplied by wire-cdt-release; derived channel: $([[ "$release_prerelease" == "true" ]] && echo prerelease || echo stable)"
              expected_prerelease="$release_prerelease"
              ;;
            *)
              echo "::error::Unknown cdt-channel '${CDT_CHANNEL}' (expected 'prerelease' or 'stable')" >&2
              exit 1
              ;;
          esac
          if [[ "$release_prerelease" != "$expected_prerelease" ]]; then
            echo "::error::Wire CDT release ${CDT_RELEASE} has prerelease=${release_prerelease}, but the v job resolved channel '${CDT_CHANNEL}'" >&2
            exit 1
          fi

          # `wire-cdt_<version>_amd64.deb` is the BASE package; the dev package is
          # `wire-cdt-dev_<version>_amd64.deb`, which this pattern does not match
          # (the base name ends at the underscore).
          mkdir -p cdt-package
          if ! download_log="$(gh release download "$CDT_RELEASE" \
                -R Wire-Network/wire-cdt \
                -p 'wire-cdt_*_amd64.deb' \
                -D cdt-package 2>&1)"; then
            not_published_hint
            echo "::error::...or the release exists but carries no wire-cdt_*_amd64.deb asset." >&2
            echo "$download_log" >&2
            gh release view "$CDT_RELEASE" -R Wire-Network/wire-cdt --json assets \
              --jq '.assets[].name' >&2 || true
            exit 1
          fi

          asset_name="$(basename "$(find cdt-package -type f -name 'wire-cdt_*_amd64.deb' -print -quit)")"
          echo "Resolved Wire CDT release ${CDT_RELEASE} (channel ${CDT_CHANNEL})"
          echo "Downloaded Wire CDT asset ${asset_name}"
          echo "CDT_ASSET_NAME=${asset_name}" >> "$GITHUB_ENV"

      - name: Install Wire CDT package for release tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          CDT_RELEASE: ${{ needs.v.outputs.cdt-release }}
        run: |
          cdt_deb="$(find cdt-package -type f -name 'wire-cdt_*_amd64.deb' -print -quit)"
          if [[ -z "$cdt_deb" ]]; then
            echo "::error::No Wire CDT Debian package was downloaded."
            find cdt-package -maxdepth 3 -type f -print || true
            exit 1
          fi
          echo "Installing Wire CDT asset ${CDT_ASSET_NAME} from release ${CDT_RELEASE}"
          sha256sum "$cdt_deb"
          bash .github/scripts/install-wire-cdt-package.sh "$cdt_deb"

      - name: Build
        id: build
        env:
          SYSIO_PLATFORM_NAME: ${{ matrix.platform }}
          SYSIO_BUILD_SYSTEM_CONTRACTS: ${{ startsWith(github.ref, 'refs/tags/v') && 'ON' || 'OFF' }}
          SYSIO_BUILD_TEST_CONTRACTS: "OFF"
          VCPKG_TARGET_TRIPLET: x64-linux-release
          VCPKG_HOST_TRIPLET: x64-linux-release
        run: |
          chown -R "$(id -u):$(id -g)" "$PWD"
          bash .github/scripts/build-sysio.sh "${{ matrix.build_jobs }}"

      # Saved immediately after the build script populated vcpkg-binary-cache, and
      # only on an exact-key miss -- GitHub Actions caches are immutable, so saving
      # onto an existing key is a wasted upload that logs a warning.
      - name: Save vcpkg binary cache
        if: ${{ success() && steps.restore-vcpkg.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-binaries-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/vcpkg-triplets/**') }}

      - name: Show vcpkg logs if failure
        if: failure()
        run: |
          echo "$PWD"
          echo "=== vcpkg-manifest-install.log ==="
          cat build/vcpkg-manifest-install.log || true

      - name: Debug environment and workspace
        if: ${{ runner.debug == '1' }}
        run: |
          echo "=== SYSTEM INFO ==="
          whoami
          id
          hostname

          echo
          echo "=== ENVIRONMENT ==="
          env | sort

          echo
          echo "=== DOCKER CONTEXT INFO ==="
          docker context ls || true
          echo "Current DOCKER_HOST: $DOCKER_HOST"
          echo "Current DOCKER_CONTEXT: $DOCKER_CONTEXT"

          echo
          echo "=== GITHUB WORKSPACE ==="
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "Current directory: $PWD"
          ls -la "$GITHUB_WORKSPACE" || true

          echo
          echo "=== PATHS & PERMISSIONS ==="
          echo "--- /github ---"
          ls -ld /github || true
          echo "--- /github/home ---"
          ls -ld /github/home || true
          echo "--- Current workspace ---"
          ls -ld "$GITHUB_WORKSPACE" || true
          echo "--- ./build ---"
          ls -ld build || true
          ls -ld "$GITHUB_WORKSPACE/build" || true
          echo "--- ./build/Testing ---"
          ls -ld build/Testing || true
          echo "--- ./build/Testing/Temporary ---"
          ls -ld build/Testing/Temporary || true

          echo
          echo "=== FILE OWNERSHIP TOP 20 ==="
          find "$GITHUB_WORKSPACE" -maxdepth 2 -type d -printf '%u:%g %p\n' 2>/dev/null | sort | uniq -c | sort -nr | head -n 20

          echo
          echo "=== MOUNTED FILESYSTEMS ==="
          df -h
          mount | grep "$GITHUB_WORKSPACE" || true

          echo
          echo "=== GIT CONFIG LOCATIONS ==="
          git config --list --show-origin || true

          echo
          echo "=== CHECK WRITABILITY OF BUILD DIR ==="
          touch build/debug_write_test 2>&1 || echo "Cannot write to build/"
          rm -f build/debug_write_test || true

      - name: Restore CTest cost data
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # actions/cache/restore@v5
        with:
          # CTest uses this file to schedule higher-cost tests first when running with -j.
          path: build/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ctest-cost-${{ matrix.platform }}-

      - name: Run Parallel Tests
        if: ${{ steps.build.outcome == 'success' && !cancelled() }}
        env:
          DOCKER_HOST: ${{ env.DOCKER_HOST }}
          DOCKER_CONTEXT: ${{ env.DOCKER_CONTEXT }}
        run: |
          cd build
          ctest --output-on-failure -j $(nproc) -LE "(nonparallelizable_tests|long_running_tests)" --timeout 1000

      - name: Run Sharded NP/LR Tests
        if: ${{ steps.build.outcome == 'success' && matrix.run_sharded_np_lr && !cancelled() }}
        run: |
          cd build
          # Run against all CPUs available to the CI container. These NP/LR tests are
          # expected to be deterministic under CI scheduling pressure; flakes caused
          # by host load, sanitizer overhead, or process interleaving are test bugs
          # that should remain visible instead of being hidden by an artificial cap.
          test_jobs="$(nproc)"
          echo "Running sharded NP/LR tests with ${test_jobs} jobs"
          ctest --output-on-failure -j "${test_jobs}" -L "(nonparallelizable_tests|long_running_tests)" --timeout 2700

      - name: Save CTest cost data
        if: ${{ always() && hashFiles('build/Testing/Temporary/CTestCostData.txt') != '' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # actions/cache/save@v5
        with:
          # Caches are immutable, so save each run under a unique key and restore by platform prefix.
          path: build/Testing/Temporary/CTestCostData.txt
          key: ctest-cost-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save ccache
        if: ${{ always() && github.event_name != 'pull_request' && steps.restore-ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.platform }}-${{ github.sha }}

      - name: Upload logs from failed tests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact@v6
        if: failure()
        with:
          name: ${{matrix.platform}}-tests-logs
          if-no-files-found: warn
          path: |
              build/Testing/Temporary/
              build/TestLogs/
              build/PerformanceHarnessScenarioRunnerLogs/

      - name: Upload core files from failed tests
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact@v6
        if: >-
          ${{ failure() &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          name: ${{matrix.platform}}-test-cores
          if-no-files-found: warn
          path: /cores

      - name: Check CPU Features
        if: ${{ steps.build.outcome == 'success' && !cancelled() }}
        run: |
          awk 'BEGIN {err = 1} /bmi2/ && /adx/ {err = 0} END {exit err}' /proc/cpuinfo
          build/tools/fsgsbase-enabled

      - name: Build packages
        if: ${{ steps.build.outcome == 'success' && !cancelled() }}
        run: |
          cd build
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            bash ../.github/scripts/assert-system-contract-build.sh .
          fi
          cpack -G DEB
          ../tools/packaging/scripts/deb-postprocess.sh wire-sysio_*.deb

      - name: Install base package
        if: ${{ steps.build.outcome == 'success' && !cancelled() }}
        run: |
          apt-get update
          apt-get install -y ./build/wire-sysio_*.deb

      - name: Assemble release package set (tgz + deb + rpm, base + dev)
        if: ${{ steps.build.outcome == 'success' && matrix.platform == 'ubuntu24' && !cancelled() }}
        run: |
          # The RPM generator needs rpmbuild; the Debian-based platform image does not ship it.
          command -v rpmbuild >/dev/null || { apt-get update && apt-get install -y rpm; }
          cd build
          cpack -G RPM
          cmake --build . --target package-tgz

      # Release-tag builds compile the system contracts from source (checked by
      # assert-system-contract-build.sh above), so the tag build is the only place
      # the .wasm/.abi pair exists. It ships as its own release asset, named
      # `wire-sysio-system-contracts-<version>.tar.gz` so that it can never be
      # mistaken for a platform tarball (`wire-sysio-<version>-<arch>.tar.gz`).
      - name: Bundle system contracts artifact
        if: ${{ steps.build.outcome == 'success' && matrix.platform == 'ubuntu24' && startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
        run: |
          set -euo pipefail
          cd build

          # The version is taken from the produced base deb so the tarball, the deb,
          # the rpm and the platform tgz can never disagree about it.
          base_deb="$(find . -maxdepth 1 -type f -name 'wire-sysio_*_amd64.deb' -print -quit)"
          [[ -n "$base_deb" ]] || { echo "::error::base deb not found; cannot derive the contracts bundle version" >&2; exit 1; }
          version="$(basename "$base_deb")"
          version="${version#wire-sysio_}"
          version="${version%_amd64.deb}"

          bundle="wire-sysio-system-contracts-${version}"
          stage="$PWD/system-contracts-stage/${bundle}"
          rm -rf "$PWD/system-contracts-stage"
          mkdir -p "$stage"

          # contracts_target() builds into <build>/contracts/sysio.<name>/, so the
          # artifacts sit at exactly depth 2 -- deeper matches would be build scratch.
          mapfile -t artifacts < <(
            find contracts -mindepth 2 -maxdepth 2 -type f \
              \( -name 'sysio.*.wasm' -o -name 'sysio.*.abi' \) | sort
          )
          if [[ ${#artifacts[@]} -eq 0 ]]; then
            echo "::error::No sysio.*.wasm / sysio.*.abi found under build/contracts" >&2
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            install -D "$artifact" "$stage/$(basename "$(dirname "$artifact")")/$(basename "$artifact")"
          done

          tar -czf "${bundle}.tar.gz" -C "$PWD/system-contracts-stage" "$bundle"
          rm -rf "$PWD/system-contracts-stage"
          echo "Bundled ${#artifacts[@]} system-contract artifacts into ${bundle}.tar.gz"

      # The resolved wire-cdt release travels with the package set so
      # release.yaml can record it in wire-sysio-versions-<version>.json without
      # re-resolving (the "latest in channel" answer is time-dependent; the
      # build's answer is the authoritative one). Transport metadata only —
      # release.yaml reads it and drops it before attaching assets.
      - name: Record build metadata
        if: ${{ steps.build.outcome == 'success' && matrix.platform == 'ubuntu24' && startsWith(github.ref, 'refs/tags/v') && !cancelled() }}
        env:
          CDT_RELEASE: ${{ needs.v.outputs.cdt-release }}
          CDT_CHANNEL: ${{ needs.v.outputs.cdt-channel }}
        run: |
          set -euo pipefail
          jq -n \
            --arg cdt_release "$CDT_RELEASE" \
            --arg cdt_channel "$CDT_CHANNEL" \
            '{ "wire-cdt": { "release": $cdt_release, "channel": $cdt_channel } }' \
            > build/build-metadata.json
          cat build/build-metadata.json

      - name: Upload release package set
        if: ${{ steps.build.outcome == 'success' && matrix.platform == 'ubuntu24' && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact@v6
        with:
          name: wire-sysio-packages-amd64
          if-no-files-found: error
          # Explicit per-artifact globs: the platform tarball is arch-suffixed and the
          # system-contracts bundle is matched by its own name, so neither can be
          # picked up as the other by glob order. build-metadata.json only exists
          # on tag builds (upload-artifact skips a missing entry when others match).
          path: |
            build/wire-sysio_*.deb
            build/wire-sysio-dev_*.deb
            build/wire-sysio-*.rpm
            build/wire-sysio-*-x86_64.tar.gz
            build/wire-sysio-system-contracts-*.tar.gz
            build/build-metadata.json

  v:
    name: Discover Versions
    runs-on: ubuntu-latest
    outputs:
      # `cdt-release` / `cdt-channel` name the RELEASE whose asset a tag build
      # installs. The former `.cicd/defaults.json` pin is gone: an explicit
      # `wire-cdt-release` input wins (channel `derive`); otherwise a tag build
      # resolves the LATEST PUBLISHED wire-cdt release in the SAME channel as
      # the version being built. The resolved value is recorded in the build's
      # `build-metadata.json` artifact and lands in the release's
      # `wire-sysio-versions-<version>.json` — the durable record.
      cdt-release: ${{steps.versions.outputs.cdt-release}}
      cdt-channel: ${{steps.versions.outputs.cdt-channel}}
    steps:
      # The version being built (and therefore the channel to resolve wire-cdt
      # in) comes from this ref's CMakeLists.txt via cmake-version.py.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5

      - name: Setup wire-cdt version
        id: versions
        env:
          GH_TOKEN: ${{secrets.GH_TOKEN_DEV}}
          # Untrusted workflow_dispatch overrides are passed as environment variables and are
          # NEVER interpolated into the script body. GitHub expands ${{ }} before bash parses the
          # script, so interpolating an override directly would let a value such as $(...) run as
          # shell code in trusted CI that holds GH_TOKEN_DEV (WSA-094 / SEC-094). As env vars the
          # values are inert data: bash does not re-evaluate command substitution found inside a
          # variable's value. github.ref is likewise read via env and quoted.
          WIRE_CDT_RELEASE: ${{ inputs.wire-cdt-release }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Defense in depth: reject ref/target overrides containing anything outside a conservative
          # allowlist. This blocks every shell metacharacter and newline (so an override can never
          # break out of $GITHUB_OUTPUT's "name=value" line either) while still accepting real values
          # such as "4.1.0" and "release/4.0". The pattern is held in a variable so [[ =~ ]] treats it
          # as a regex, and the candidate matched is only ever the variable's literal value.
          ref_re='^[A-Za-z0-9._/+-]+$'
          if [[ -n "$WIRE_CDT_RELEASE" && ! "$WIRE_CDT_RELEASE" =~ $ref_re ]]; then
            echo "::error::Invalid wire-cdt-release '$WIRE_CDT_RELEASE'; only [A-Za-z0-9._/+-] are allowed." >&2
            exit 1
          fi

          # An explicit release wins. Its channel is set to the `derive`
          # sentinel: the download step then reports the release's OWN
          # prerelease flag instead of asserting a resolved channel.
          if [[ -n "$WIRE_CDT_RELEASE" ]]; then
            {
              echo "cdt-release=$WIRE_CDT_RELEASE"
              echo "cdt-channel=derive"
            } >> "$GITHUB_OUTPUT"
            echo "Using explicit wire-cdt release ${WIRE_CDT_RELEASE} (channel derived from the release)"
            exit 0
          fi

          # Only tag builds install CDT (the download/install steps are gated on
          # refs/tags/v*); non-tag builds emit empty outputs that nothing reads.
          if [[ "$REF" != refs/tags/v* ]]; then
            {
              echo "cdt-release="
              echo "cdt-channel="
            } >> "$GITHUB_OUTPUT"
            echo "Non-tag build: no wire-cdt release to resolve."
            exit 0
          fi

          # The version's suffix IS the channel (same rule as everywhere on the
          # Strategy-C path); resolve the latest PUBLISHED wire-cdt release in
          # that channel. There is no first-class "latest prerelease" endpoint,
          # so the release list is filtered by draft/prerelease and the newest
          # by creation date wins — the same resolution prepare-release
          # performed when it wrote the retired .cicd/defaults.json pin.
          version="$(python3 .github/scripts/cmake-version.py read)"
          if [[ "$version" == *-* ]]; then
            channel="prerelease"
            prerelease="true"
          else
            channel="stable"
            prerelease="false"
          fi

          releases_json="$(
            gh api "repos/Wire-Network/wire-cdt/releases?per_page=100" \
              -H "X-GitHub-Api-Version: 2022-11-28"
          )"
          cdt_release="$(
            jq -r --argjson pre "$prerelease" '
              [.[] | select(.draft == false and .prerelease == $pre)]
              | sort_by(.created_at)
              | last
              | .tag_name // empty' <<<"$releases_json"
          )"
          if [[ -z "$cdt_release" ]]; then
            echo "::error::No published wire-cdt release found for channel ${channel} (version ${version}). Publish one, or dispatch with an explicit wire-cdt-release." >&2
            exit 1
          fi

          {
            echo "cdt-release=$cdt_release"
            echo "cdt-channel=$channel"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved wire-cdt ${cdt_release} (latest published in channel ${channel} for version ${version})"

  verify-packages:
    name: Verify packages (S1-S6)
    needs: [build-test-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8.0.1
        with:
          name: wire-sysio-packages-amd64
          path: artifacts

      - name: Run packaging verification suite
        run: |
          # No version argument: on this path the artifact names carry a version
          # this job does not know, so the suite uses its documented safe globs.
          # The suite owns the artifact list and the no-bare-tgz-glob rule, shared
          # with release.yaml's verification of the same package set.
          tools/packaging/tests/verify-all.sh artifacts

  all-passing:
    name: All Required Tests Passed
    needs: [ build-test-package, root-node-tooling, verify-packages ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification
        if: always()
        uses: Wire-Network/notification-action@1c7a5e0e881f7560c4fab64db9676036bf8b017f # Wire-Network/notification-action@v1
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          notification-type: 1
          workflow-name: "Build & Test Workflow"
          job-results: "build-test-package:${{ needs.build-test-package.result }},root-node-tooling:${{ needs.root-node-tooling.result }},verify-packages:${{ needs.verify-packages.result }}"
          github-context: ${{ toJSON(github) }}

      - if: needs.build-test-package.result != 'success' || needs.root-node-tooling.result != 'success' || needs.verify-packages.result != 'success'
        run: false
